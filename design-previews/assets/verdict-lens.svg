      <path d="M0 0V72M36 0V72" stroke="#37646a" stroke-opacity=".022"/>
    </pattern>
    <clipPath id="lensClip">
      <circle cx="840" cy="442" r="270"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#thinRules)"/>
  <path d="M-80 254C220 168 428 210 628 326c193 112 348 139 567 63 152-53 304-63 477-6V570c-184-65-347-48-515 16-196 76-372 41-555-80C415 383 201 341-80 430Z" fill="url(#beam)"/>

