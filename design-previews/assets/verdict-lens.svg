  <g transform="translate(150 666)" fill="#453c34" font-family="Manrope, Pretendard, system-ui, sans-serif">
    <text x="0" y="0" font-size="18" font-weight="800" letter-spacing="3" opacity=".64">VERDICT LENS</text>
    <text x="0" y="34" font-size="13" font-weight="700" opacity=".42">analysis focus / final score framing</text>
