    <rect x="530" y="132" width="620" height="620" fill="#fffefa" opacity=".4"/>
    <g fill="none" stroke-linecap="round">
      <path d="M558 512C655 404 754 391 839 430c85 39 137 120 235 100 54-11 96-48 137-95" stroke="#453c34" stroke-opacity=".19" stroke-width="1.4"/>
      <path d="M548 464C654 368 756 356 844 393c80 34 134 99 225 85 58-9 107-41 153-83" stroke="#b08a52" stroke-opacity=".48" stroke-width="1.9"/>
      <path d="M566 420C673 338 768 332 854 362c83 29 137 79 220 72 56-5 104-30 146-68" stroke="#37646a" stroke-opacity=".34" stroke-width="1.4"/>
