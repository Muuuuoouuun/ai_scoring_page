<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset=".54" stop-color="#f0ece2"/>
      <stop offset="1" stop-color="#e5ddd0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#453c34" stop-opacity="0"/>
      <stop offset=".36" stop-color="#37646a" stop-opacity=".13"/>
      <stop offset=".58" stop-color="#b08a52" stop-opacity=".25"/>
      <stop offset="1" stop-color="#453c34" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="verdict" x1=".12" y1=".1" x2=".9" y2=".88">
      <stop offset="0" stop-color="#4f5f4a" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#b08a52" stop-opacity=".54"/>
      <stop offset="1" stop-color="#453c34" stop-opacity=".52"/>
    </linearGradient>
    <filter id="softNoise">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.25 0 0 0 0 0.22 0 0 0 0 0.18 0 0 0 .045 0"/>
    </filter>
    <pattern id="thinRules" width="72" height="72" patternUnits="userSpaceOnUse">
