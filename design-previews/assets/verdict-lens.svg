    </g>
    <g stroke="#453c34" stroke-opacity=".08">
      <line x1="540" y1="442" x2="1140" y2="442"/>
      <line x1="840" y1="142" x2="840" y2="742"/>
      <line x1="628" y1="230" x2="1052" y2="654"/>
      <line x1="1052" y1="230" x2="628" y2="654"/>
    </g>
  </g>

  <g transform="translate(840 442)" fill="none" stroke-linecap="round">
    <circle r="314" stroke="#453c34" stroke-opacity=".06" stroke-width="1"/>
    <circle r="270" stroke="#453c34" stroke-opacity=".11" stroke-width="1.4"/>
    <circle r="214" stroke="#453c34" stroke-opacity=".07" stroke-width="1"/>
    <circle r="156" stroke="#453c34" stroke-opacity=".08" stroke-width="1"/>
