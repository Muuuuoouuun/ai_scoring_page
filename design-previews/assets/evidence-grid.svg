<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset=".5" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#e8e1d5"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37646a" stop-opacity=".58"/>
      <stop offset=".52" stop-color="#b08a52" stop-opacity=".6"/>
      <stop offset="1" stop-color="#453c34" stop-opacity=".6"/>
    </linearGradient>
    <filter id="paperGrain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.28 0 0 0 0 0.24 0 0 0 0 0.19 0 0 0 .05 0"/>
    </filter>
    <pattern id="auditGrid" width="120" height="84" patternUnits="userSpaceOnUse">
      <path d="M0 0H120V84H0Z" fill="none" stroke="#453c34" stroke-opacity=".04"/>
      <path d="M30 0V84M60 0V84M90 0V84M0 42H120" stroke="#453c34" stroke-opacity=".026"/>
    </pattern>
    <mask id="edgeFade">
      <radialGradient id="edgeFadeGradient" cx="52%" cy="46%" r="76%">
        <stop offset="0" stop-color="#fff"/>
        <stop offset=".68" stop-color="#fff"/>
        <stop offset="1" stop-color="#000"/>
      </radialGradient>
      <rect width="1600" height="900" fill="url(#edgeFadeGradient)"/>
    </mask>
  </defs>

  <rect width="1600" height="900" fill="url(#sheet)"/>
  <rect width="1600" height="900" fill="url(#auditGrid)"/>

  <g mask="url(#edgeFade)" opacity=".92">
    <g transform="translate(210 178)" fill="none" stroke="#453c34">
