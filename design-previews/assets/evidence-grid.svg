    </g>

    <g transform="translate(1128 196)" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="164" stroke="#453c34" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="122" stroke="#453c34" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="80" stroke="#453c34" stroke-opacity=".08"/>
      <path d="M0 -164A164 164 0 0 1 152 62" stroke="url(#mark)" stroke-width="9"/>
      <path d="M0 -122A122 122 0 0 1 96 75" stroke="#b08a52" stroke-opacity=".46" stroke-width="5"/>
      <path d="M0 -80A80 80 0 0 1 65 47" stroke="#37646a" stroke-opacity=".36" stroke-width="3"/>
      <path d="M-104 -72L-22 -18L34 -116L84 20L146 -64" stroke="#453c34" stroke-opacity=".22" stroke-width="1.4"/>
