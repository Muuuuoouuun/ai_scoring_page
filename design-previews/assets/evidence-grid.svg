  <g transform="translate(214 108)" font-family="Manrope, Pretendard, system-ui, sans-serif" fill="#453c34">
    <text x="0" y="0" font-size="18" font-weight="800" letter-spacing="3" opacity=".64">EVIDENCE GRID</text>
    <text x="0" y="34" font-size="13" font-weight="700" opacity=".42">audit table / review signal architecture</text>
