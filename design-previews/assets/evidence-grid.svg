        <path d="M442 144H578" stroke="#b08a52" stroke-opacity=".34"/>
        <path d="M650 144H784" stroke-opacity=".12"/>

        <path d="M48 236H120" stroke-opacity=".12"/>
        <path d="M232 236H356" stroke="#b08a52" stroke-opacity=".34"/>
        <path d="M442 236H548" stroke-opacity=".17"/>
        <path d="M650 236H806" stroke="#37646a" stroke-opacity=".22"/>

        <path d="M48 328H150" stroke="#b08a52" stroke-opacity=".3"/>
