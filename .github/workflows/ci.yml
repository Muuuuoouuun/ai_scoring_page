name: CI

# main으로 들어오는 모든 변경을 같은 검증에 태웁니다.
# 지금까지는 이 검증이 로컬에서만 돌아서, 누군가 npm test를 기억해야만
# 리뷰 무결성 규칙이 지켜지는 상태였습니다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 진행 중이던 실행은 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 타입체크 · 테스트 · 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 로컬에서 검증한 런타임과 같은 메이저 버전입니다.
          node-version: '22'
          cache: npm

      - run: npm ci

      # 가장 빠르고 실패 원인이 가장 분명해서 맨 앞에 둡니다.
      - name: 타입체크
        run: npx tsc --noEmit

      # 이 프로젝트의 정직성 규칙이 실제로 강제되는 지점입니다 —
      # 도구 간 문장 재사용 금지, 근거 없는 점수 금지, 표본 3 미만 평균 금지.
      - name: 테스트
        run: npm test

      # data/tools.ts가 리뷰 없는 도구를 빌드 시점에 거부하므로,
      # 빌드가 통과한다는 것 자체가 하나의 검증입니다.
      - name: 빌드
        run: npm run build

# npm run lint는 일부러 넣지 않았습니다.
# 이 저장소에는 eslint 설정도 의존성도 없어서, next lint가 CI에서
# 대화형 초기 설정을 시도하며 멈춥니다. 린트를 걸려면 먼저 설정을 추가해야 합니다.
