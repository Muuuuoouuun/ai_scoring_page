name: Site CI

on:
  pull_request:
    branches:
      - main
      - 'codex/**'
      - 'codex.*'
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  push:
    branches:
      - main
      - 'codex/**'
      - 'codex.*'
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

jobs:
  site-checks:
    name: site-typecheck-tests-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked site dependencies
        run: npm run install:ci
      - name: Check site types
        run: npx tsc --noEmit
      - name: Run site regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Run Home streaming tests
        run: node --conditions=react-server --test tests/home-streaming.mjs
      - name: Build site with vinext
        run: npm run build
